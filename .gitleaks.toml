# Gitleaks config for the CI secret scan (.github/workflows/ci.yml, job
# "secrets"). It keeps gitleaks' default rules and allowlists the few strings
# in this repository that look like credentials but are not. Add a regex here
# only for a value that is public by nature; never allowlist a path, so a
# real token in a test fixture is still caught.
title = "teamclaude"

[extend]
useDefault = true

[[allowlists]]
description = "Public constants that match the generic-api-key rule"
regexTarget = "match"
regexes = [
  # Claude Code's OAuth client id. It ships in every Claude Code install and
  # is a public identifier, not a secret.
  '''9d1c250a-e61b-44d9-88ed-5944d1962f5e''',
  # The Sec-WebSocket-Key example from RFC 6455 section 1.3, used by tests.
  '''dGhlIHNhbXBsZSBub25jZQ==''',
]
