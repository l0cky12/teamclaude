name: Publish

# Publish to npm whenever a version bump lands on master. The job runs after
# CI finishes on a master commit and compares the package.json version against
# what is already on npm, so it only publishes when CI passed AND the version
# is new — merging any other PR is a no-op. Publishing is idempotent:
# re-running on the same version simply skips.
#
# Authentication uses npm Trusted Publishing (OIDC) — no long-lived NPM_TOKEN.
# npm mints a short-lived credential from the GitHub OIDC token at publish time,
# and provenance is attached automatically. This requires a one-time setup on
# npmjs.com: on the package's Settings → Trusted Publisher, add a GitHub Actions
# publisher for owner KarpelesLab, repo teamclaude, workflow "publish.yml".
on: # zizmor: ignore[dangerous-triggers] workflow_run here is master-only, see below
  # Triggered by ci.yml completing on master, whatever its result; the job's
  # `if` below only lets a successful run through. The checkout is pinned to
  # the commit CI tested, not to whatever master is by the time this starts.
  # workflow_run is dangerous when a workflow checks out an untrusted head
  # with write permissions; `branches` limits this one to runs whose head is
  # master, so the checkout is always a commit that was merged by a maintainer.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  # Manual trigger: publish the version currently on master on demand. Useful to
  # backfill a version that was bumped before this workflow existed, or to re-run
  # after fixing the npm Trusted Publisher setup. It must be dispatched on
  # master, CI must already have passed on that commit, and the npm-view check
  # below still gates it, so a manual run on a published version is a no-op.
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: publish to npm
    # Only the canonical repository publishes: npm's Trusted Publisher is bound
    # to KarpelesLab/teamclaude, so a fork that bumps the version would only
    # fail here. Forks keep CI; they just never reach `npm publish`.
    #
    # For a workflow_run, the triggering run must be a `push` to this
    # repository's master that succeeded. `branches` above matches the HEAD
    # branch name only, and a pull request from a fork branch called "master"
    # has that name too; the event and head_repository checks keep such a
    # run's unmerged commit away from the publishing credentials.
    # A manual run must be dispatched on master, and a step below confirms CI
    # passed on that exact commit before anything else happens.
    if: >-
      github.repository == 'KarpelesLab/teamclaude' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'master' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # create the git tag + GitHub release
      id-token: write   # OIDC token for npm Trusted Publishing + provenance
      actions: read     # list CI runs for the manual-dispatch gate
    env:
      # The commit CI passed on (or master's tip for a manual run).
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # A manual run gets the same gate as an automatic one: a CI run for
      # this exact commit, triggered by a push to master, that succeeded.
      - name: Require a successful CI run for this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          count=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&event=push&status=success&per_page=1"             --jq '.workflow_runs | length')
          if [ "$count" = "0" ]; then
            echo "::error::No successful CI run (push to master) exists for $HEAD_SHA. Wait for CI or fix it first."
            exit 1
          fi
          echo "CI passed on $HEAD_SHA."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Read package version
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already on npm
        id: check
        env:
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published — skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION is new — will publish."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Deliberately no `npm install` here. The package has zero runtime
      # dependencies, the tests are plain `node --test` and import nothing from
      # node_modules, and the published tarball is just `files: ["src/"]`. The
      # devDependencies (eslint, typescript, @types/node) serve ci.yml's lint and
      # typecheck steps, not this job. This
      # job holds `id-token: write` + `contents: write` and ends in `npm publish`,
      # so pulling ~90 unpinned transitive packages from the registry (and
      # running their lifecycle scripts) in the same job would hand any one of
      # them a path to publishing under our name.
      - name: Run tests
        if: steps.check.outputs.publish == 'true'
        run: npm test

      # Trusted Publishing (OIDC) needs npm >= 11.5.1. Upgrade so this works
      # regardless of which npm the runner image happens to ship.
      #
      # Pinned to an exact version rather than `npm@latest`: this is the one tool
      # that receives our OIDC token and builds the tarball, so it must not be
      # whatever the registry serves at run time. Dependabot does not track this
      # line (only the `uses:` actions), so bump it by hand occasionally
      # (`npm view npm version`); anything >= 11.5.1 keeps publishing working.
      - name: Upgrade npm for Trusted Publishing
        if: steps.check.outputs.publish == 'true'
        run: npm install -g npm@12.0.2 # zizmor: ignore[adhoc-packages] exact version, see above

      - name: Publish to npm (Trusted Publishing via OIDC)
        if: steps.check.outputs.publish == 'true'
        # No NODE_AUTH_TOKEN: npm exchanges the OIDC token (id-token: write) for a
        # short-lived publish credential, and attaches provenance automatically.
        run: npm publish --access public

      - name: Tag the release and create a GitHub release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          tag="v${VERSION}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists — skipping release."
          else
            gh release create "$tag" \
              --target "$HEAD_SHA" \
              --title "$tag" \
              --generate-notes
          fi
